<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soham Khot — Cybersecurity Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f6f7f9;
      --bg-tertiary: #f0f2f5;
      --text-primary: #111318;
      --text-secondary: #4b5263;
      --text-tertiary: #8a91a0;
      --border: rgba(0,0,0,0.10);
      --border-medium: rgba(0,0,0,0.18);
      --blue-bg: #E6F1FB;
      --blue-mid: #378ADD;
      --blue-dark: #185FA5;
      --blue-border: #B5D4F4;
      --green-bg: #EAF3DE;
      --green-mid: #639922;
      --green-dark: #3B6D11;
      --green-border: #C0DD97;
      --amber-bg: #FAEEDA;
      --amber-dark: #854F0B;
      --amber-border: #FAC775;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1c22;
        --bg-secondary: #22242c;
        --bg-tertiary: #2a2d38;
        --text-primary: #e8eaf0;
        --text-secondary: #9aa0b4;
        --text-tertiary: #5c6278;

        --border-medium: rgba(255,255,255,0.18);
        --blue-bg: #0c2a45;
        --blue-mid: #378ADD;
        --blue-dark: #85B7EB;
        --blue-border: #0c447c;
        --green-bg: #173404;
        --green-mid: #639922;
        --green-dark: #C0DD97;
        --green-border: #27500A;
        --amber-bg: #412402;
        --amber-dark: #FAC775;
        --amber-border: #633806;
      }
    }

    html { scroll-behavior: smooth; scroll-padding-top: 70px; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 15px;
      line-height: 1.6;
    }

    /* Nav */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg);
      border-bottom: 0.5px solid var(--border);
      padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 56px;
    }
    .nav-brand { font-size: 15px; font-weight: 600; color: var(--text-primary); cursor: default; }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links button { font-size: 13px; color: var(--text-secondary); text-decoration: none; background: none; border: none; cursor: pointer; font-family: inherit; padding: 0; }
    .nav-links button:hover { color: var(--blue-mid); }
    .nav-links button.active { color: var(--blue-mid); font-weight: 500; }

    /* Layout */
    .page { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    /* Hero */
    .hero {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      display: flex; align-items: flex-start; gap: 2rem;
      margin-bottom: 1.5rem;
    }
    .avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--blue-bg); border: 0.5px solid var(--blue-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 600; color: var(--blue-dark);
      flex-shrink: 0;
    }
    .hero-text h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.3px; }
    .hero-role { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
    .hero-meta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    .meta-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
    .meta-chip i { font-size: 14px; color: var(--blue-mid); }
    .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 4px 11px; border-radius: 99px; }
    .badge-green { background: var(--green-bg); color: var(--green-dark); border: 0.5px solid var(--green-border); }
    .badge-amber { background: var(--amber-bg); color: var(--amber-dark); border: 0.5px solid var(--amber-border); }
    .badge-blue { background: var(--blue-bg); color: var(--blue-dark); border: 0.5px solid var(--blue-border); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-mid); }

    /* Section */
    section { margin-bottom: 1.5rem; }
    .section-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--text-tertiary);
      margin-bottom: 1rem;
    }

    /* Card base */
    .card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
    }

    /* About */
    .about-text { font-size: 14px; color: var(--text-secondary); line-height: 1.75; }

    /* Skills */
    .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 10px; }
    .skill-card {
      background: var(--bg); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 16px;
    }
    .skill-icon { font-size: 20px; color: var(--blue-dark); margin-bottom: 8px; }
    .skill-name { font-size: 13px; font-weight: 500; }
    .skill-desc { font-size: 12px; color: var(--text-secondary); margin-top: 3px; line-height: 1.4; }
    .bar-wrap { margin-top: 10px; height: 3px; background: var(--bg-secondary); border-radius: 99px; overflow: hidden; }
    .bar { height: 100%; border-radius: 99px; background: var(--blue-mid); }

    /* Projects */
    .project-list { display: flex; flex-direction: column; gap: 12px; }
    .project-card {
      background: var(--bg); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 18px 20px;
      display: flex; gap: 16px;
    }
    .proj-icon {
      width: 38px; height: 38px; border-radius: var(--radius-md);
      background: var(--blue-bg); border: 0.5px solid var(--blue-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--blue-dark); flex-shrink: 0;
    }
    .proj-icon.green { background: var(--green-bg); border-color: var(--green-border); color: var(--green-dark); }
    .proj-icon.amber { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber-dark); }
    .proj-body { flex: 1; min-width: 0; }
    .proj-title { font-size: 14px; font-weight: 500; }
    .proj-label { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
    .proj-desc { font-size: 13px; color: var(--text-secondary); margin-top: 8px; line-height: 1.65; }
    .highlight-box {
      border-left: 2px solid var(--blue-mid);
      padding: 9px 12px;
      background: var(--blue-bg);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      margin-top: 10px;
      font-size: 12px; color: var(--blue-dark); line-height: 1.5;
    }
    .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .tag { font-size: 11px; padding: 3px 9px; border-radius: 99px; background: var(--blue-bg); color: var(--blue-dark); border: 0.5px solid var(--blue-border); }
    .tag-green { background: var(--green-bg); color: var(--green-dark); border-color: var(--green-border); }
    .tag-gray { background: var(--bg-secondary); color: var(--text-secondary); border: 0.5px solid var(--border); }

    /* Timeline */
    .timeline { padding-left: 20px; border-left: 0.5px solid var(--border); display: flex; flex-direction: column; gap: 1.4rem; }
    .tl-item { position: relative; }
    .tl-dot {
      position: absolute; left: -24px; top: 5px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--blue-mid);
      border: 2px solid var(--bg);
      box-shadow: 0 0 0 1px var(--blue-border);
    }
